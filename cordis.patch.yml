# Disable official tool-subagent (spawn path; this plugin takes over the
# `subagent` tool name). The fork path (`tool-subagent-fork`, tool name
# `subagent_fork`) is left intact — no name collision with this plugin's
# single `subagent` tool, and fork delegation stays available to the model.
- id: tool-subagent
  disabled: true

# Insert this plugin. The row id doubles as the settings/profile entry id
# (dsh 0.1.7-rc.1 DSH-0.1.7-RC1-04): it is deliberately kept as the legacy
# `ya-subagent` namespace so the host's one-time `$DSH_HOME/settings.yaml`
# import maps the existing profile section onto this entry.
- insert:
    - id: ya-subagent
      name: '@huanlin/dsh-plugin-yet-another-subagent'
      config:
        profiles:
          - id: general
            label: General
            model: { kind: 'auto' }
            persona: { kind: 'inherit' }
            toolFilter: { kind: 'none' }
            maxDepth: 1
            builtin: true
        generalFixed: true
